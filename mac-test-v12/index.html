const STABLE='composition_lab_mac_memory';function odb(){return new Promise((res,rej)=>{const r=indexedDB.open(STABLE,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('data'))r.result.createObjectStore('data')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function g(k){const db=await odb(),v=await new Promise((res,rej)=>{const tx=db.transaction('data','readonly'),r=tx.objectStore('data').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});db.close();return v}async function p(k,v){const db=await odb();await new Promise((res,rej)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}function download(o,n){const b=new Blob([JSON.stringify(o,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function backup(keys){const x=safeClone(state)||{};if(!keys)x.keys={openai:'',anthropic:'',gemini:''};download({format:'composition-lab-backup',version:3,createdAt:new Date().toISOString(),containsApiKeys:keys,state:x,history:await g('history')||state.history||[],templates:await g('templates')||state.templates||[],comparisons:await g('comparisons')||window.v5Comparisons||[]},'Composition-Lab-Backup-'+(keys?'vollstaendig':'ohne-API-Schluessel')+'.json');if(keys)alert('Backup erstellt. Die Datei enthält API-Schlüssel und muss vertraulich behandelt werden.')}async function restore(f){const b=JSON.parse(await f.text());if(b?.format!=='composition-lab-backup')throw Error('Kein Composition-Lab-Backup.');if(!confirm('Backup wirklich wiederherstellen?'))return;Object.assign(state,safeClone(b.state)||{});state.history=Array.isArray(b.history)?safeClone(b.history):[];state.templates=Array.isArray(b.templates)?safeClone(b.templates):[];window.v5Comparisons=Array.isArray(b.comparisons)?safeClone(b.comparisons):[];await p('history',state.history);await p('templates',state.templates);await p('comparisons',window.v5Comparisons);saveState();syncUI();renderHistory();renderCompareSelectors();window.renderV5ComparisonHistory?.();alert('Backup wiederhergestellt.');}
function addBackupBox(){const techBtn=[...document.querySelectorAll('.menu')].find(m=>/^Technisches/i.test(m.textContent.trim()));const panel=techBtn?.querySelector('.menu-panel');if(panel&&!panel.querySelector('[data-v12backup]')){const sep=document.createElement('div');sep.dataset.v12backup='1';sep.style.cssText='border-top:1px solid #ccd2d9;margin:6px 0';panel.appendChild(sep);[['Vollständiges Backup erstellen …',()=>backup(true)],['Backup ohne API-Schlüssel …',()=>backup(false)],['Backup wiederherstellen …',null]].forEach(([txt,fn],i)=>{const b=document.createElement('button');b.textContent=txt;if(fn)b.onclick=fn;else{const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.style.display='none';inp.onchange=async()=>{try{if(inp.files[0])await restore(inp.files[0])}catch(e){alert('Wiederherstellung fehlgeschlagen: '+e.message)}inp.value=''};panel.appendChild(inp);b.onclick=()=>inp.click()}panel.appendChild(b)})}
