<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Composition Lab – Mac Test V4</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8ebef}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="../mac-test-v3/?macv4=1"></iframe><script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{let tries=0;const timer=setInterval(()=>{tries++;try{const d=frame.contentDocument,w=frame.contentWindow;if(!d?.getElementById('composeBtn')){if(tries>100)clearInterval(timer);return;}clearInterval(timer);const s=d.createElement('script');s.textContent=`(()=>{
const random=document.getElementById('randomIdea');if(random)random.remove();
const tl=document.getElementById('templateLength');if(tl&&!document.getElementById('labSettingsHeading')){const h=document.createElement('h3');h.id='labSettingsHeading';h.textContent='Einstellungen';tl.closest('.field')?.before(h);}
const saveBtn=document.getElementById('saveMidi');if(saveBtn&&!document.getElementById('analyzeCurrent')){const b=document.createElement('button');b.className='btn';b.id='analyzeCurrent';b.textContent='Mit KI analysieren';saveBtn.parentElement.appendChild(b);const wrap=document.createElement('div');wrap.id='currentAnalysisWrap';wrap.style.cssText='display:none;margin-top:12px';wrap.innerHTML='<h3>KI-Analyse der aktuellen Komposition</h3><div class="idea-box" id="currentAnalysis"></div><div class="chatinput"><textarea id="currentAnalysisFollow" placeholder="Nachfrage zur Analyse …"></textarea><button class="btn primary" id="currentAnalysisFollowSend">Senden</button></div>';saveBtn.parentElement.after(wrap);let analysis='';b.onclick=()=>busy(b,async()=>{wrap.style.display='block';const box=document.getElementById('currentAnalysis');box.textContent='Analyse wird gestartet …';try{const score=state.current;if(!score)throw Error('Noch keine aktuelle Komposition vorhanden.');analysis=await callLLM('Du bist ein musikalischer Analytiker. Analysiere die aktuelle Komposition musikalisch, nicht bloß technisch. Gliedere knapp in Charakter und Idee, Form und Motivik, Harmonik und Rhythmik, Stärken, mögliche Schwächen und zwei bis drei konkrete Verbesserungsideen. Maximal etwa 250 Wörter.','Analysiere diese Komposition:\\n'+JSON.stringify(compactScore(score,5000)));box.textContent=analysis;}catch(e){box.textContent='Fehler: '+e.message;}});document.getElementById('currentAnalysisFollowSend').onclick=()=>busy(document.getElementById('currentAnalysisFollowSend'),async()=>{const q=document.getElementById('currentAnalysisFollow').value.trim();if(!q)return;const box=document.getElementById('currentAnalysis');try{const score=state.current;if(!score)throw Error('Noch keine aktuelle Komposition vorhanden.');const a=await callLLM('Du bist ein musikalischer Analyse- und Kompositionspartner. Beantworte die Nachfrage konkret auf Grundlage der vorherigen Analyse und der MIDI-Daten.','Vorherige Analyse:\\n'+(analysis||box.textContent)+'\\n\\nNachfrage: '+q+'\\n\\nMIDI:\\n'+JSON.stringify(compactScore(score,5000)));analysis+=(analysis?'\\n\\n':'')+'Nachfrage: '+q+'\\n'+a;box.textContent=analysis;document.getElementById('currentAnalysisFollow').value='';}catch(e){box.textContent+='\\n\\nFehler: '+e.message;}});}
const legacyHistory=safeClone(state.history)||[],legacyTemplates=safeClone(state.templates)||[];const originalSave=saveState;const DB='composition_lab_mac_history_v4';
function dbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('data'))r.result.createObjectStore('data')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbPut(k,v){const db=await dbOpen();await new Promise((res,rej)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}
async function dbGet(k){const db=await dbOpen();const v=await new Promise((res,rej)=>{const tx=db.transaction('data','readonly'),r=tx.objectStore('data').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});db.close();return v}
let persistTimer=null;function persistHistories(){clearTimeout(persistTimer);persistTimer=setTimeout(()=>{dbPut('history',safeClone(state.history)||[]).catch(()=>{});dbPut('templates',safeClone(state.templates)||[]).catch(()=>{});},50)}
saveState=function(){const h=state.history,t=state.templates;state.history=[];state.templates=[];try{originalSave()}finally{state.history=h;state.templates=t}persistHistories()};
(async()=>{try{const h=await dbGet('history'),t=await dbGet('templates');state.history=Array.isArray(h)?h:legacyHistory;state.templates=Array.isArray(t)?t:legacyTemplates;renderHistory();renderCompareSelectors();persistHistories();saveState();}catch(e){state.history=legacyHistory;state.templates=legacyTemplates;renderHistory();}})();
})();`;d.body.appendChild(s);}catch(e){if(tries>100)clearInterval(timer)}},100);});
</script></body></html>
