<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Composition Lab – Mac Test V5</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8ebef}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="../mac-test-v3/?macv5=1"></iframe><script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{let tries=0;const timer=setInterval(()=>{tries++;try{const d=frame.contentDocument;if(!d?.getElementById('composeBtn')){if(tries>120)clearInterval(timer);return;}clearInterval(timer);const s=d.createElement('script');s.textContent=`(()=>{
/* V5: klare Trennung Kompositionsidee / Kompositionsauftrag */
const idea=document.getElementById('compIdea');if(idea&&!document.getElementById('compTask')){const ideaLabel=document.createElement('h3');ideaLabel.textContent='Kompositionsidee';idea.closest('.field').before(ideaLabel);const taskWrap=document.createElement('div');taskWrap.className='field';taskWrap.innerHTML='<label>Kompositionsauftrag</label><textarea id="compTask" class="bigtext" placeholder="Was soll die KI konkret mit der Idee bzw. Vorlage tun?">Entwickle daraus ein geschlossenes, motivisch nachvollziehbares Stück.</textarea>';idea.closest('.field').after(taskWrap);}
const random=document.getElementById('randomIdea');if(random)random.remove();
const cb=document.getElementById('composeBtn');if(cb&&!cb.dataset.v5wrap){cb.dataset.v5wrap='1';const old=cb.onclick;cb.onclick=async function(e){const ideaEl=document.getElementById('compIdea'),taskEl=document.getElementById('compTask'),orig=ideaEl.value,task=taskEl?.value||'';ideaEl.value='Kompositionsidee: '+orig+'\\n\\nKompositionsauftrag: '+task;try{const r=await old.call(this,e);if(state.current){state.current._meta={...(state.current._meta||{}),idea:orig,task};if(state.history?.length){state.history[state.history.length-1]=safeClone(state.current)}saveState();renderHistory();}return r}finally{ideaEl.value=orig}}}
/* Experimentallabor-Einstellungen und Verlauf sichtbar */
const tl=document.getElementById('templateLength');if(tl){tl.innerHTML='<option value="2">2 Takte</option><option value="4" selected>4 Takte</option><option value="8">8 Takte</option>';if(!document.getElementById('labSettingsHeading')){const h=document.createElement('h3');h.id='labSettingsHeading';h.textContent='Einstellungen';tl.closest('.field')?.before(h);}}['templateLength','labTempo','labEnsemble','labStyle'].forEach(id=>{const e=document.getElementById(id);if(e)e.closest('.field').style.display='flex'});const th=document.getElementById('templateHistory');if(th){th.style.display='block';th.style.maxHeight='260px';const prev=th.previousElementSibling;if(prev)prev.textContent='Vorlagenverlauf';}
/* KI-Analyse der aktuellen Komposition */
const saveBtn=document.getElementById('saveMidi');if(saveBtn&&!document.getElementById('analyzeCurrent')){const b=document.createElement('button');b.className='btn';b.id='analyzeCurrent';b.textContent='Mit KI analysieren';saveBtn.parentElement.appendChild(b);const wrap=document.createElement('div');wrap.id='currentAnalysisWrap';wrap.style.cssText='display:none;margin-top:12px';wrap.innerHTML='<h3>KI-Analyse der aktuellen Komposition</h3><div class="idea-box" id="currentAnalysis"></div><div class="chatinput"><textarea id="currentAnalysisFollow" placeholder="Nachfrage zur Analyse …"></textarea><button class="btn primary" id="currentAnalysisFollowSend">Senden</button></div>';saveBtn.parentElement.after(wrap);let analysis='';b.onclick=()=>busy(b,async()=>{wrap.style.display='block';const box=document.getElementById('currentAnalysis');box.textContent='Analyse wird gestartet …';try{const score=state.current;if(!score)throw Error('Noch keine aktuelle Komposition vorhanden.');analysis=await callLLM('Du bist ein musikalischer Analytiker. Analysiere die aktuelle Komposition musikalisch, nicht bloß technisch. Gliedere knapp in Charakter und Idee, Form und Motivik, Harmonik und Rhythmik, Stärken, mögliche Schwächen und zwei bis drei konkrete Verbesserungsideen. Maximal etwa 250 Wörter.','Analysiere diese Komposition:\\n'+JSON.stringify(compactScore(score,5000)));box.textContent=analysis}catch(e){box.textContent='Fehler: '+e.message}});document.getElementById('currentAnalysisFollowSend').onclick=()=>busy(document.getElementById('currentAnalysisFollowSend'),async()=>{const q=document.getElementById('currentAnalysisFollow').value.trim();if(!q)return;const box=document.getElementById('currentAnalysis');try{const score=state.current;if(!score)throw Error('Noch keine aktuelle Komposition vorhanden.');const a=await callLLM('Du bist ein musikalischer Analyse- und Kompositionspartner. Beantworte die Nachfrage konkret auf Grundlage der vorherigen Analyse und der MIDI-Daten.','Vorherige Analyse:\\n'+(analysis||box.textContent)+'\\n\\nNachfrage: '+q+'\\n\\nMIDI:\\n'+JSON.stringify(compactScore(score,5000)));analysis+=(analysis?'\\n\\n':'')+'Nachfrage: '+q+'\\n'+a;box.textContent=analysis;document.getElementById('currentAnalysisFollow').value=''}catch(e){box.textContent+='\\n\\nFehler: '+e.message}})}
/* Loop-Schalter für alle Player */
const loopState={};document.querySelectorAll('.player').forEach(box=>{const id=box.dataset.player,line=box.querySelector('.playerline');if(line&&!line.querySelector('.loop')){const b=document.createElement('button');b.className='btn loop';b.textContent='↻ Loop';b.title='Wiedergabe wiederholen';b.onclick=()=>{loopState[id]=!loopState[id];b.style.fontWeight=loopState[id]?'700':'400';b.setAttribute('aria-pressed',String(!!loopState[id]))};line.insertBefore(b,line.querySelector('.progress'));line.style.gridTemplateColumns='auto auto auto auto minmax(80px,1fr) auto auto 92px';}});const oldUpdate=updatePlayer;updatePlayer=function(id){const p=audio.players[id],box=document.querySelector('[data-player="'+id+'"]');if(p&&box&&p.score){const dur=durationOf(p.score);let pos=p.offset||0;if(p.playing)pos+=getCtx().currentTime-p.startAt;if(pos>=dur&&dur&&loopState[id]){stopPlayer(id);p.offset=0;playPlayer(id);return}}return oldUpdate(id)};
/* robuste Verläufe für Kompositionen und Vorlagen via IndexedDB */
const legacyHistory=safeClone(state.history)||[],legacyTemplates=safeClone(state.templates)||[],originalSave=saveState,DB='composition_lab_mac_history_v5';function dbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('data'))r.result.createObjectStore('data')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function dbPut(k,v){const db=await dbOpen();await new Promise((res,rej)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}async function dbGet(k){const db=await dbOpen();const v=await new Promise((res,rej)=>{const tx=db.transaction('data','readonly'),r=tx.objectStore('data').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});db.close();return v}let pt=null;function persistHistories(){clearTimeout(pt);pt=setTimeout(()=>{dbPut('history',safeClone(state.history)||[]).catch(()=>{});dbPut('templates',safeClone(state.templates)||[]).catch(()=>{});dbPut('comparisons',safeClone(window.v5Comparisons||[])).catch(()=>{})},30)}saveState=function(){const h=state.history,t=state.templates;state.history=[];state.templates=[];try{originalSave()}finally{state.history=h;state.templates=t}persistHistories()};
/* Vergleichsverlauf */
window.v5Comparisons=[];const compareChat=document.getElementById('compareChat');if(compareChat&&!document.getElementById('comparisonHistory')){const card=compareChat.closest('.card');const h=document.createElement('h3');h.textContent='Vergleichsverlauf';const list=document.createElement('div');list.className='list';list.id='comparisonHistory';card.appendChild(h);card.appendChild(list);function renderCompHist(){list.innerHTML='';if(!window.v5Comparisons.length){list.innerHTML='<div class="item muted">Noch kein Vergleich gespeichert.</div>';return}window.v5Comparisons.slice().reverse().forEach(x=>{const d=document.createElement('div');d.className='item';d.innerHTML='<strong>'+esc(x.q||'Vergleich')+'</strong><small>'+esc((x.a||'').slice(0,110))+'</small>';d.onclick=()=>{if(x.A)state.compareA=safeClone(x.A);if(x.B)state.compareB=safeClone(x.B);renderCompareSelectors();addMsg(compareChat,'user',x.q||'Vergleich');addMsg(compareChat,'ai',x.a||'')};list.appendChild(d)})}const send=document.getElementById('compareChatSend'),input=document.getElementById('compareChatInput');if(send){const old=send.onclick;send.onclick=async function(e){const q=input.value.trim(),before=compareChat.querySelectorAll('.msg.ai').length;const r=await old.call(this,e);setTimeout(()=>{const ais=[...compareChat.querySelectorAll('.msg.ai')];if(q&&ais.length>before){const a=ais[ais.length-1].textContent;window.v5Comparisons.push({q,a,A:safeClone(state.compareA),B:safeClone(state.compareB),ts:Date.now()});if(window.v5Comparisons.length>30)window.v5Comparisons.shift();renderCompHist();persistHistories()}},50);return r}}window.renderV5ComparisonHistory=renderCompHist;renderCompHist()}
(async()=>{try{const h=await dbGet('history'),t=await dbGet('templates'),c=await dbGet('comparisons');state.history=Array.isArray(h)&&h.length?h:legacyHistory;state.templates=Array.isArray(t)&&t.length?t:legacyTemplates;window.v5Comparisons=Array.isArray(c)?c:[];renderHistory();renderCompareSelectors();window.renderV5ComparisonHistory?.();persistHistories()}catch(e){state.history=legacyHistory;state.templates=legacyTemplates;renderHistory()}})();
})();`;d.body.appendChild(s)}catch(e){if(tries>120)clearInterval(timer)}},100)});
</script></body></html>
