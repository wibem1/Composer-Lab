<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Composition Lab – Mac Test V15</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8ebef}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="../mac-test-v14/?v15direct=20260903-2"></iframe><script>
const outer=document.getElementById('app');
function deepest(){try{let w=outer.contentWindow;for(let i=0;i<8;i++){const f=w.document.querySelector('iframe');if(!f)break;if(!f.contentWindow)break;w=f.contentWindow}return w}catch(e){return null}}
function esc(x){return String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function install(){const w=deepest();if(!w||!w.document||!w.document.getElementById('composeBtn'))return false;const d=w.document;if(d.documentElement.dataset.v15direct==='1')return true;d.documentElement.dataset.v15direct='1';
const about=d.getElementById('aboutBtn');if(about){about.textContent='Über Composition Lab – Version 15';about.onclick=()=>alert('Composition Lab\nMac Test Version 15\nStand: 3. September 2026')}
// V14-Verlaufskästen und ältere Vergleichsverläufe entfernen.
['v14TemplateHistory','v14CompareHistory','v15TemplateHistory','v15CompareHistory'].forEach(id=>{const e=d.getElementById(id);if(e){const h=e.previousElementSibling;if(h&&h.tagName==='H3')h.remove();e.remove()}});const oldCmp=d.getElementById('comparisonHistory');if(oldCmp){const h=oldCmp.previousElementSibling;if(h&&h.tagName==='H3'&&/Vergleichsverlauf/.test(h.textContent))h.remove();oldCmp.remove()}
function cards(page){return [...page.children].filter(e=>e.classList&&e.classList.contains('card'))}
const exp=d.getElementById('experiment');if(exp){const cs=cards(exp),host=cs[1]||cs[0];if(host&&!d.getElementById('v15TemplateHistoryDirect')){const h=d.createElement('h3');h.textContent='Vorlagenverlauf';const l=d.createElement('div');l.id='v15TemplateHistoryDirect';l.className='list';l.style.maxHeight='260px';host.append(h,l)}}
const cmp=d.getElementById('compare');if(cmp){const cs=cards(cmp),host=cs[1]||cs[0];if(host&&!d.getElementById('v15CompareHistoryDirect')){const h=d.createElement('h3');h.textContent='Vergleichsverlauf';const l=d.createElement('div');l.id='v15CompareHistoryDirect';l.className='list';l.style.maxHeight='260px';host.append(h,l)}}
function render(){const ta=Array.isArray(w.state?.templates)?w.state.templates:[],tl=d.getElementById('v15TemplateHistoryDirect');if(tl){tl.innerHTML='';if(!ta.length)tl.innerHTML='<div class="item muted">Noch keine Vorlage gespeichert.</div>';ta.slice().reverse().forEach((x,ri)=>{const idx=ta.length-1-ri,q=d.createElement('div');q.className='item';q.innerHTML='<strong>'+esc(x?.ti||x?.title||('Vorlage '+(idx+1)))+'</strong><small>'+esc((x?._meta?.measures||'?')+' Takte · '+(x?._meta?.ensemble||'MIDI')+' · '+(x?.bpm||120)+' BPM')+'</small>';q.onclick=()=>{w.state.template=w.safeClone(x);w.saveState();w.renderTemplate();};tl.appendChild(q)})}
const ca=Array.isArray(w.v5Comparisons)?w.v5Comparisons:[],cl=d.getElementById('v15CompareHistoryDirect');if(cl){cl.innerHTML='';if(!ca.length)cl.innerHTML='<div class="item muted">Noch kein Vergleich gespeichert.</div>';ca.slice().reverse().forEach((x,ri)=>{const idx=ca.length-1-ri,q=d.createElement('div');q.className='item';q.innerHTML='<strong>'+esc(x?.q||('Vergleich '+(idx+1)))+'</strong><small>'+esc((x?.a||'').slice(0,140))+'</small>';q.onclick=()=>{if(x.A)w.state.compareA=w.safeClone(x.A);if(x.B)w.state.compareB=w.safeClone(x.B);w.renderCompareSelectors();const log=d.getElementById('compareChat');if(log){log.innerHTML='';w.addMsg(log,'user',x.q||'Vergleich');w.addMsg(log,'ai',x.a||'')}};cl.appendChild(q)})}}
render();let sig='';setInterval(()=>{const s=(w.state?.templates?.length||0)+'|'+(w.v5Comparisons?.length||0);if(s!==sig){sig=s;render()}},400);
return true}
let tries=0;const timer=setInterval(()=>{tries++;if(install()||tries>600)clearInterval(timer)},100);outer.addEventListener('load',()=>{tries=0});
</script></body></html>
