<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Composition Lab – Mac Test V15</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8ebef}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="../mac-test-v5/?v15=20260903-3"></iframe><script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{let tries=0;const timer=setInterval(()=>{tries++;try{let d=frame.contentDocument;const inner=d?.getElementById('app');if(inner?.contentDocument)d=inner.contentDocument;if(!d?.getElementById('composeBtn')){if(tries>300)clearInterval(timer);return}clearInterval(timer);const s=d.createElement('script');s.textContent=`(()=>{
const VERSION='15';
const about=document.getElementById('aboutBtn');if(about){about.textContent='Über Composition Lab – Version '+VERSION;about.onclick=()=>alert('Composition Lab\\nMac Test Version '+VERSION+'\\nStand: 3. September 2026')}
function esc2(x){return String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
// Gemini 3.8 Flash direkt im sichtbaren Feld und im technischen Feld.
const pp=document.getElementById('pageProvider'),pm=document.getElementById('pageModel'),tp=document.getElementById('provider'),tm=document.getElementById('model');function forceGemini(){if(pp?.value==='gemini'){if(pm)pm.value='gemini-3.8-flash';if(tp)tp.value='gemini';if(tm)tm.value='gemini-3.8-flash';state.provider='gemini';state.model='gemini-3.8-flash';try{localStorage.setItem('composition-lab-mac-ai-ui',JSON.stringify({provider:'gemini',model:'gemini-3.8-flash',strength:document.getElementById('reasoningStrength')?.value||'medium'}))}catch(e){}}}pp?.addEventListener('change',()=>setTimeout(forceGemini,0));forceGemini();
// Loop-Zustand sichtbar.
const sty=document.createElement('style');sty.textContent='button.loop[aria-pressed="true"]{background:#2563eb!important;color:#fff!important;border-color:#1d4ed8!important;font-weight:700!important}';document.head.appendChild(sty);document.querySelectorAll('button.loop').forEach(b=>{const paint=()=>b.textContent=b.getAttribute('aria-pressed')==='true'?'↻ Loop: EIN':'↻ Loop: AUS';paint();b.addEventListener('click',()=>setTimeout(paint,0));new MutationObserver(paint).observe(b,{attributes:true,attributeFilter:['aria-pressed']})});
// Alte Verlaufselemente entfernen und mittig neu anlegen.
['comparisonHistory','v14TemplateHistory','v14CompareHistory','v15TemplateHistory','v15CompareHistory','v15TemplateHistoryDirect','v15CompareHistoryDirect'].forEach(id=>{const e=document.getElementById(id);if(e){const h=e.previousElementSibling;if(h?.tagName==='H3'&&/verlauf/i.test(h.textContent||''))h.remove();e.remove()}});
function card2(page){const cs=[...page.children].filter(x=>x.classList?.contains('card'));return cs[1]||cs[0]}
const exp=document.getElementById('experiment'),cmp=document.getElementById('compare');if(exp){const host=card2(exp),h=document.createElement('h3'),l=document.createElement('div');h.textContent='Vorlagenverlauf';l.id='v15TemplateHistory';l.className='list';l.style.maxHeight='260px';host.append(h,l)}if(cmp){const host=card2(cmp),h=document.createElement('h3'),l=document.createElement('div');h.textContent='Vergleichsverlauf';l.id='v15CompareHistory';l.className='list';l.style.maxHeight='260px';host.append(h,l)}
let comps=[];try{comps=JSON.parse(localStorage.getItem('composition_lab_mac_comparisons_v15')||'[]')}catch(e){}if(!Array.isArray(comps))comps=[];if(Array.isArray(window.v5Comparisons)&&window.v5Comparisons.length)comps=window.v5Comparisons;
function saveComps(){try{localStorage.setItem('composition_lab_mac_comparisons_v15',JSON.stringify(comps.slice(-50)))}catch(e){}}
function renderV15(){const tl=document.getElementById('v15TemplateHistory'),ta=Array.isArray(state.templates)?state.templates:[];if(tl){tl.innerHTML='';if(!ta.length)tl.innerHTML='<div class="item muted">Noch keine Vorlage gespeichert.</div>';ta.slice().reverse().forEach(x=>{const q=document.createElement('div');q.className='item';q.innerHTML='<strong>'+esc2(x?.ti||x?.title||'Vorlage')+'</strong><small>'+esc2((x?._meta?.measures||'?')+' Takte · '+(x?._meta?.ensemble||'MIDI')+' · '+(x?.bpm||120)+' BPM')+'</small>';q.onclick=()=>{state.template=safeClone(x);saveState();renderTemplate();};tl.appendChild(q)})}const cl=document.getElementById('v15CompareHistory');if(cl){cl.innerHTML='';if(!comps.length)cl.innerHTML='<div class="item muted">Noch kein Vergleich gespeichert.</div>';comps.slice().reverse().forEach(x=>{const q=document.createElement('div');q.className='item';q.innerHTML='<strong>'+esc2(x.q||'Vergleich')+'</strong><small>'+esc2((x.a||'').slice(0,140))+'</small>';q.onclick=()=>{if(x.A)state.compareA=safeClone(x.A);if(x.B)state.compareB=safeClone(x.B);renderCompareSelectors();const log=document.getElementById('compareChat');if(log){log.innerHTML='';addMsg(log,'user',x.q||'Vergleich');addMsg(log,'ai',x.a||'')}};cl.appendChild(q)})}}
renderV15();
const gen=document.getElementById('generateTemplate');gen?.addEventListener('click',()=>{const n=state.templates?.length||0;let k=0;const z=setInterval(()=>{k++;if((state.templates?.length||0)!==n){renderV15();clearInterval(z)}if(k>120)clearInterval(z)},250)});
const send=document.getElementById('compareChatSend'),input=document.getElementById('compareChatInput'),log=document.getElementById('compareChat');send?.addEventListener('click',()=>{const q=input?.value.trim()||'',before=log?.querySelectorAll('.msg.ai').length||0;if(!q)return;let k=0;const z=setInterval(()=>{k++;const ais=[...(log?.querySelectorAll('.msg.ai')||[])];if(ais.length>before){const a=ais[ais.length-1].textContent||'';comps.push({q,a,A:safeClone(state.compareA),B:safeClone(state.compareB),ts:Date.now()});if(comps.length>50)comps.shift();window.v5Comparisons=comps;saveComps();renderV15();clearInterval(z)}if(k>160)clearInterval(z)},250)});
// Backup unter Technisches belassen/ergänzen.
const tech=[...document.querySelectorAll('.menu')].find(m=>m.querySelector(':scope>span')?.textContent.trim()==='Technisches');const dd=tech?.querySelector('.dropdown');if(dd&&!dd.querySelector('[data-v15backup]')){const hr=document.createElement('hr');hr.dataset.v15backup='1';dd.appendChild(hr);const add=(txt,fn)=>{const b=document.createElement('button');b.textContent=txt;b.onclick=fn;dd.appendChild(b)};function dl(obj,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};add('Backup: vollständig erstellen …',()=>dl({format:'composition-lab-backup',version:15,state:safeClone(state),comparisons:comps},'Composition-Lab-Backup-V15-vollstaendig.json'));add('Backup: ohne API-Schlüssel …',()=>{const x=safeClone(state);x.keys={openai:'',anthropic:'',gemini:''};dl({format:'composition-lab-backup',version:15,state:x,comparisons:comps},'Composition-Lab-Backup-V15-ohne-API-Schluessel.json')});}
})();`;d.body.appendChild(s)}catch(e){if(tries>300)clearInterval(timer)}},100)});
</script></body></html>
