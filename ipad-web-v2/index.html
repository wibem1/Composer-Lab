<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Composition Lab"><meta name="theme-color" content="#f3f5f8"><title>Composition Lab – iPad Web V2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8ebef}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="../mac-test-v17/?ipad-v2=1"></iframe><script>
const outer=document.getElementById('app');outer.addEventListener('load',()=>{let tries=0;const timer=setInterval(()=>{tries++;try{let d=outer.contentDocument;for(let i=0;i<8;i++){const f=d?.getElementById('app');if(f?.contentDocument)d=f.contentDocument;else break}if(!d?.getElementById('composeBtn')){if(tries>500)clearInterval(timer);return}clearInterval(timer);const s=d.createElement('script');s.textContent=`(()=>{const VERSION='iPad Web V2';const st=document.createElement('style');st.textContent=\`

x!important;white-space:nowrap!important}.chatinput{grid-template-columns:minmax(0,1fr) 92px!important}.chatinput .btn{min-height:52px!important}.toolbar{gap:8px!important;flex-wrap:wrap!important}.btn{min-height:42px!important}.list{max-width:100%!important;overflow:hidden!important}
@media(max-width:1050px){.titlebar{grid-template-columns:330px minmax(0,1fr)!important}.page{grid-template-columns:minmax(260px,.9fr) minmax(340px,1.15fr) minmax(300px,1fr)!important;padding:10px!important;gap:10px!important}.card{padding:12px!important}.tab{font-size:15px!important;padding:7px 6px!important}}
\`;document.head.appendChild(st);const about=document.getElementById('aboutBtn');if(about){about.textContent='Über Composition Lab – '+VERSION;about.onclick=()=>alert('Composition Lab\\n'+VERSION+'\\nStand: 3. September 2026')}const title=document.querySelector('.titlebar');if(title&&!document.getElementById('ipadTech')){const b=document.createElement('button');b.id='ipadTech';b.className='btn';b.textContent='⚙︎ Technisches';b.onclick=()=>{const tech=document.getElementById('techBtn')||document.getElementById('techMenu');if(tech)tech.click();else{const m=[...document.querySelectorAll('.menu')].find(x=>/Technisches/i.test(x.textContent||''));m?.querySelector('span,button')?.click()}};title.appendChild(b)}
// iPad: Text im Loop-Schalter kompakt halten.
document.querySelectorAll('.player .loop').forEach(b=>{b.innerHTML='↻<br>Loop';});
})();`;d.body.appendChild(s)}catch(e){if(tries>500)clearInterval(timer)}},100)});</script></body></html>
