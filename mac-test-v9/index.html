<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Composition Lab – Mac Test V9</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8ebef}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="outer" src="../mac-test-v7/?macv9=1"></iframe><script>
const outer=document.getElementById('outer');outer.addEventListener('load',()=>{let tries=0;const timer=setInterval(()=>{tries++;try{const od=outer.contentDocument,mid=od?.getElementById('outer'),md=mid?.contentDocument,inner=md?.getElementById('app'),d=inner?.contentDocument;if(!d?.getElementById('composeBtn')){if(tries>220)clearInterval(timer);return}clearInterval(timer);const s=d.createElement('script');s.textContent=`(()=>{
const STABLE='composition_lab_mac_memory';
function openStable(){return new Promise((res,rej)=>{const r=indexedDB.open(STABLE,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('data'))r.result.createObjectStore('data')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function getStable(k){const db=await openStable();const v=await new Promise((res,rej)=>{const tx=db.transaction('data','readonly'),r=tx.objectStore('data').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});db.close();return v}
async function putStable(k,v){const db=await openStable();await new Promise((res,rej)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}
function dl(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function stamp(){return new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)}
async function makeBackup(includeKeys){const h=await getStable('history')||state.history||[],t=await getStable('templates')||state.templates||[],c=await getStable('comparisons')||window.v5Comparisons||[];const settings=safeClone(state)||{};if(!includeKeys)settings.keys={openai:'',anthropic:'',gemini:''};const out={format:'composition-lab-backup',version:2,createdAt:new Date().toISOString(),containsApiKeys:!!includeKeys,state:settings,history:safeClone(h),templates:safeClone(t),comparisons:safeClone(c)};dl(out,'Composition-Lab-Backup-'+(includeKeys?'VOLLSTAENDIG':'OHNE-SCHLUESSEL')+'-'+stamp()+'.json');if(includeKeys)alert('Vollständiges Backup erstellt. ACHTUNG: Die Datei enthält deine API-Schlüssel und muss vertraulich behandelt werden.')}
async function restoreBackup(file){const text=await file.text();let b;try{b=JSON.parse(text)}catch(e){throw Error('Die Datei ist keine gültige JSON-Backup-Datei.')}if(b?.format!=='composition-lab-backup')throw Error('Diese Datei ist kein Composition-Lab-Backup.');if(!confirm('Backup wiederherstellen? Der aktuelle Projektzustand und die Verläufe werden durch den Stand der Backup-Datei ersetzt.'))return;const incoming=b.state&&typeof b.state==='object'?safeClone(b.state):{};const keys=incoming.keys||{};Object.keys(state).forEach(k=>delete state[k]);Object.assign(state,incoming);state.keys={openai:keys.openai||'',anthropic:keys.anthropic||'',gemini:keys.gemini||''};state.history=Array.isArray(b.history)?safeClone(b.history):[];state.templates=Array.isArray(b.templates)?safeClone(b.templates):[];window.v5Comparisons=Array.isArray(b.comparisons)?safeClone(b.comparisons):[];await putStable('history',state.history);await putStable('templates',state.templates);await putStable('comparisons',window.v5Comparisons);try{const x=safeClone(state);x.history=[];x.templates=[];localStorage.setItem('composition_lab_mac_webapp_v1',JSON.stringify(x))}catch(e){}try{localStorage.setItem('composition-lab-mac-ai-ui',JSON.stringify({provider:state.provider||'openai',model:state.model||''}))}catch(e){}syncUI();renderHistory();renderCompareSelectors();window.renderV5ComparisonHistory?.();alert('Backup wurde wiederhergestellt'+(b.containsApiKeys?' – einschließlich API-Schlüssel.':'.')+'');}
const fileMenu=[...document.querySelectorAll('.menu')].find(m=>m.textContent.trim().startsWith('Datei'));const panel=fileMenu?.querySelector('.menu-panel');if(panel){panel.querySelectorAll('button').forEach(b=>{if(b.textContent.includes('Backup'))b.remove()});const full=document.createElement('button');full.textContent='Vollständiges Backup erstellen …';full.onclick=()=>makeBackup(true);const safe=document.createElement('button');safe.textContent='Backup ohne API-Schlüssel …';safe.onclick=()=>makeBackup(false);const restore=document.createElement('button');restore.textContent='Backup wiederherstellen …';const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.style.display='none';input.onchange=async()=>{if(!input.files?.[0])return;try{await restoreBackup(input.files[0])}catch(e){alert('Wiederherstellung fehlgeschlagen: '+e.message)}finally{input.value=''}};restore.onclick=()=>input.click();panel.append(full,safe,restore,input)}
})();`;d.body.appendChild(s)}catch(e){if(tries>220)clearInterval(timer)}},100)});</script></body></html>
