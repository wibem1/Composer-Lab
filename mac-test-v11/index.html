<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Composition Lab – Mac Test V11</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8ebef}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="outer" src="../mac-test-v10/?macv11=1"></iframe><script>
const outer=document.getElementById('outer');outer.addEventListener('load',()=>{let tries=0;const timer=setInterval(()=>{tries++;try{let d=outer.contentDocument;for(let i=0;i<5;i++){const f=d?.querySelector('iframe');if(!f)break;d=f.contentDocument}if(!d?.getElementById('composeBtn')){if(tries>260)clearInterval(timer);return}clearInterval(timer);const s=d.createElement('script');s.textContent=`(()=>{
// Gemini: aktuelles stabiles Flash-Modell zuerst anbieten.
function patchGeminiSelect(sel){if(!sel)return;const old=sel.value;const opts=[['gemini-3.8-flash','Gemini 3.8 Flash'],['gemini-3.7-flash','Gemini 3.7 Flash'],['gemini-3.1-pro-preview','Gemini 3.1 Pro Preview']];sel.innerHTML='';for(const [v,n] of opts){const o=document.createElement('option');o.value=v;o.textContent=n;sel.appendChild(o)}sel.value=opts.some(x=>x[0]===old)?old:'gemini-3.8-flash';sel.dispatchEvent(new Event('change',{bubbles:true}))}
const provider=document.getElementById('aiProvider')||document.getElementById('provider');const model=document.getElementById('aiModel')||document.getElementById('model');function syncGem(){if((provider?.value||state.provider)==='gemini')patchGeminiSelect(model)}provider?.addEventListener('change',()=>setTimeout(syncGem,0));syncGem();
// Auch technische Modell-Auswahl aktualisieren, wenn vorhanden.
document.querySelectorAll('select').forEach(sel=>{if([...sel.options].some(o=>/gemini-3\./i.test(o.value||o.textContent)) && (provider?.value==='gemini'||/model/i.test(sel.id||''))){const vals=[...sel.options].map(o=>o.value);if(!vals.includes('gemini-3.8-flash')){const o=document.createElement('option');o.value='gemini-3.8-flash';o.textContent='Gemini 3.8 Flash';sel.insertBefore(o,sel.firstChild)}}});
// Loop-Schalter: Zustand sichtbar machen.
const css=document.createElement('style');css.textContent='.cl-loop-active{background:#2563eb!important;color:#fff!important;border-color:#1d4ed8!important;box-shadow:inset 0 0 0 2px rgba(255,255,255,.22)}';document.head.appendChild(css);document.querySelectorAll('button').forEach(b=>{if(/^loop\b/i.test(b.textContent.trim())||/loop/i.test(b.id||'')){let on=b.classList.contains('cl-loop-active')||b.getAttribute('aria-pressed')==='true';const paint=()=>{b.classList.toggle('cl-loop-active',on);b.setAttribute('aria-pressed',String(on));b.textContent=on?'Loop: EIN':'Loop: AUS'};b.addEventListener('click',()=>{on=!on;paint()});paint()}});
// Backup-Menü aus Datei nach Technisches verschieben.
const menus=[...document.querySelectorAll('.menu')];const tech=menus.find(m=>/^Technisches/i.test(m.textContent.trim()));const tp=tech?.querySelector('.menu-panel');const file=menus.find(m=>/^Datei/i.test(m.textContent.trim()));const fp=file?.querySelector('.menu-panel');if(tp){const backupButtons=[];menus.forEach(m=>m.querySelectorAll('.menu-panel button').forEach(b=>{if(/Backup/i.test(b.textContent))backupButtons.push(b)}));if(backupButtons.length){const sep=document.createElement('div');sep.style.cssText='border-top:1px solid #d7dce2;margin:5px 0';tp.appendChild(sep);backupButtons.forEach(b=>tp.appendChild(b))}}
})();`;d.body.appendChild(s)}catch(e){if(tries>260)clearInterval(timer)}},100)});</script></body></html>
