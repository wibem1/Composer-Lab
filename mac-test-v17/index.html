function clean(){const history=document.getElementById('v15CompareHistory');const historyCard=history?.closest('.card');const chat=document.getElementById('compareChat');const chatCard=chat?.closest('.card');if(chatCard){[...chatCard.querySelectorAll('h1,h2,h3,h4')].forEach(h=>{if(/vergleichsverlauf/i.test((h.textContent||'').trim())){let n=h.nextElementSibling;if(n&&n!==history&&(/history|verlauf/i.test(n.id||'')||n.classList.contains('list')))n.remove();h.remove()}});[...chatCard.querySelectorAll('*')].forEach(e=>{if(e===history||e.closest('.card')===historyCard)return;const id=e.id||'';if(/compare.*history|comparisonhistory|vergleich.*verlauf/i.test(id))e.remove()})}

clean();let n=0;const z=setInterval(()=>{clean();if(++n>80)clearInterval(z)},250);
