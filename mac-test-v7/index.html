<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Composition Lab – Mac Test V7</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8ebef}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="outer" src="../mac-test-v5/?macv7=1"></iframe><script>
const outer=document.getElementById('outer');outer.addEventListener('load',()=>{let tries=0;const timer=setInterval(()=>{tries++;try{const od=outer.contentDocument,inner=od?.getElementById('app'),d=inner?.contentDocument;if(!d?.getElementById('composeBtn')){if(tries>180)clearInterval(timer);return}clearInterval(timer);const s=d.createElement('script');s.textContent=`(()=>{
const STABLE='composition_lab_mac_memory';const LEGACY=['composition_lab_mac_history_v4','composition_lab_mac_history_v5'];
function openDB(name){return new Promise((res,rej)=>{const r=indexedDB.open(name,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('data'))r.result.createObjectStore('data')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function getDB(name,key){try{const db=await openDB(name);const v=await new Promise((res,rej)=>{const tx=db.transaction('data','readonly'),r=tx.objectStore('data').get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});db.close();return v}catch(e){return null}}
async function putDB(name,key,val){const db=await openDB(name);await new Promise((res,rej)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(val,key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}
function sig(x){try{return JSON.stringify([x?.ti,x?.bpm,x?.sm,(x?.tr||[]).reduce((n,t)=>n+(t.nt||[]).length,0)])}catch(e){return String(Math.random())}}
function merge(...arrs){const out=[],seen=new Set();for(const a of arrs){if(!Array.isArray(a))continue;for(const x of a){const k=sig(x);if(!seen.has(k)){seen.add(k);out.push(x)}}}return out}
async function recover(){let raw={};try{raw=JSON.parse(localStorage.getItem('composition_lab_mac_webapp_v1')||'{}')}catch(e){}const h4=await getDB(LEGACY[0],'history'),t4=await getDB(LEGACY[0],'templates'),h5=await getDB(LEGACY[1],'history'),t5=await getDB(LEGACY[1],'templates'),c5=await getDB(LEGACY[1],'comparisons'),hs=await getDB(STABLE,'history'),ts=await getDB(STABLE,'templates'),cs=await getDB(STABLE,'comparisons');const H=merge(hs,h5,h4,raw.history,state.history),T=merge(ts,t5,t4,raw.templates,state.templates),C=merge(cs,c5,window.v5Comparisons);state.history=H.slice(-50);state.templates=T.slice(-50);window.v5Comparisons=C.slice(-50);await putDB(STABLE,'history',safeClone(state.history)||[]);await putDB(STABLE,'templates',safeClone(state.templates)||[]);await putDB(STABLE,'comparisons',safeClone(window.v5Comparisons)||[]);renderHistory();renderCompareSelectors();window.renderV5ComparisonHistory?.();return{h:H.length,t:T.length,c:C.length}}
const previousSave=saveState;saveState=function(){const h=state.history,t=state.templates,c=window.v5Comparisons;try{previousSave()}catch(e){}putDB(STABLE,'history',safeClone(h)||[]).catch(()=>{});putDB(STABLE,'templates',safeClone(t)||[]).catch(()=>{});putDB(STABLE,'comparisons',safeClone(c)||[]).catch(()=>{})};
recover().then(n=>{const b=document.createElement('div');b.style.cssText='position:fixed;right:14px;bottom:14px;z-index:9999;background:#243447;color:white;padding:9px 12px;border-radius:7px;font:12px -apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 3px 14px rgba(0,0,0,.2)';b.textContent='Gedächtnis: '+n.h+' Kompositionen, '+n.t+' Vorlagen, '+n.c+' Vergleiche gefunden.';document.body.appendChild(b);setTimeout(()=>b.remove(),6000)}).catch(e=>console.warn('V7 recovery',e));
})();`;d.body.appendChild(s)}catch(e){if(tries>180)clearInterval(timer)}},100)});</script></body></html>
