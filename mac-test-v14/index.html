<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Composition Lab – Mac Test V14</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8ebef}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="../mac-test-v5/?v14=20260902-1"></iframe><script>
const frame=document.getElementById('app');frame.addEventListener('load',()=>{let ticks=0;const t=setInterval(()=>{ticks++;try{let d=frame.contentDocument;const inner=d?.getElementById('app');if(inner?.contentDocument)d=inner.contentDocument;if(!d?.getElementById('composeBtn')){if(ticks>300)clearInterval(t);return}if(d.getElementById('v14marker')){clearInterval(t);return}const s=d.createElement('script');s.id='v14marker';s.textContent=`(()=>{
const VERSION='14';
function esc2(x){return String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
// Versionsanzeige.
const about=document.getElementById('aboutBtn');if(about){about.textContent='Über Composition Lab – Version '+VERSION;about.onclick=()=>alert('Composition Lab\\nMac Test Version '+VERSION+'\\nStand: 2. September 2026')}
// Gedächtnis-Banner dauerhaft entfernen.
function removeMemoryBanner(){[...document.querySelectorAll('body *')].forEach(e=>{const x=(e.textContent||'').trim();if(/^Gedächtnis:/i.test(x)||/^Verlaufsspeicher V/i.test(x)||/^Frühere Verläufe wurden/i.test(x))e.remove()})}
removeMemoryBanner();
// Gemini: das sichtbare Feld ist pageModel ein INPUT, nicht ein SELECT. Genau dort lag der bisherige Fehler.
function applyGemini(){const pp=document.getElementById('pageProvider'),pm=document.getElementById('pageModel'),tp=document.getElementById('provider'),tm=document.getElementById('model');if(pp&&pp.value==='gemini'){if(pm&&pm.value!=='gemini-3.8-flash')pm.value='gemini-3.8-flash';if(tp)tp.value='gemini';if(tm)tm.value='gemini-3.8-flash';if(typeof state!=='undefined'){state.provider='gemini';state.model='gemini-3.8-flash'}try{localStorage.setItem('composition-lab-mac-ai-ui',JSON.stringify({provider:'gemini',model:'gemini-3.8-flash',strength:document.getElementById('reasoningStrength')?.value||'medium'}))}catch(e){}}}
const pp=document.getElementById('pageProvider');if(pp&&!pp.dataset.v14){pp.dataset.v14='1';pp.addEventListener('change',()=>{if(pp.value==='gemini'){const pm=document.getElementById('pageModel');if(pm)pm.value='gemini-3.8-flash';setTimeout(applyGemini,0)}})}
// Datalist bereinigen und 3.8 zuerst.
function patchModelLists(){['pageModelSuggestions','modelSuggestions'].forEach(id=>{const dl=document.getElementById(id);if(!dl)return;[...dl.querySelectorAll('option')].forEach(o=>{if(o.value==='gemini-3.8-flash')o.remove()});const o=document.createElement('option');o.value='gemini-3.8-flash';dl.insertBefore(o,dl.firstChild)})}

// Loop sichtbar.

// Eigene sichtbare Verläufe, unabhängig davon, ob ältere V5-Elemente sichtbar sind.
function ensureHistoryBoxes(){const exp=document.getElementById('experiment');if(exp&&!document.getElementById('v14TemplateHistory')){const cards=exp.querySelectorAll('.card');const host=cards[cards.length-1]||exp;const h=document.createElement('h3');h.textContent='Vorlagenverlauf';const list=document.createElement('div');list.id='v14TemplateHistory';list.className='list';host.append(h,list)}const cmp=document.getElementById('compare');if(cmp&&!document.getElementById('v14CompareHistory')){const cards=cmp.querySelectorAll('.card');const host=cards[cards.length-1]||cmp;const h=document.createElement('h3');h.textContent='Vergleichsverlauf';const list=document.createElement('div');list.id='v14CompareHistory';list.className='list';host.append(h,list)}}
function renderHistories(){ensureHistoryBoxes();const th=document.getElementById('v14TemplateHistory');if(th){const arr=Array.isArray(state?.templates)?state.templates:[];th.innerHTML=arr.length?arr.slice().reverse().map((x,i)=>'<div class="item"><strong>'+esc2(x?.title||x?.name||('Vorlage '+(arr.length-i)))+'</strong><small>'+esc2(x?._meta?.idea||x?.idea||'Gespeicherte Vorlage')+'</small></div>').join(''):'<div class="item muted">Noch keine Vorlage gespeichert.</div>'}const ch=document.getElementById('v14CompareHistory');if(ch){const arr=Array.isArray(window.v5Comparisons)?window.v5Comparisons:[];ch.innerHTML=arr.length?arr.slice().reverse().map(x=>'<div class="item"><strong>'+esc2(x.q||'Vergleich')+'</strong><small>'+esc2((x.a||'').slice(0,140))+'</small></div>').join(''):'<div class="item muted">Noch kein Vergleich gespeichert.</div>'}}
// Backup unter Technisches als eigener Menüblock.
const DB='composition_lab_mac_memory';function odb(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('data'))r.result.createObjectStore('data')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function get(k){const db=await odb(),v=await new Promise((ok,no)=>{const r=db.transaction('data','readonly').objectStore('data').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});db.close();return v}async function put(k,v){const db=await odb();await new Promise((ok,no)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(v,k);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});db.close()}function dl(o,n){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function makeBackup(withKeys){const x=safeClone(state)||{};if(!withKeys)x.keys={openai:'',anthropic:'',gemini:''};dl({format:'composition-lab-backup',version:5,appVersion:VERSION,createdAt:new Date().toISOString(),containsApiKeys:withKeys,state:x,history:await get('history')||state.history||[],templates:await get('templates')||state.templates||[],comparisons:await get('comparisons')||window.v5Comparisons||[]},'Composition-Lab-Backup-V'+VERSION+(withKeys?'-vollstaendig':'-ohne-API-Schluessel')+'.json');if(withKeys)alert('Vollständiges Backup erstellt. Die Datei enthält API-Schlüssel und muss vertraulich behandelt werden.')}async function restore(f){let b;try{b=JSON.parse(await f.text())}catch(e){throw Error('Ungültige JSON-Datei.')}if(b?.format!=='composition-lab-backup')throw Error('Kein Composition-Lab-Backup.');if(!confirm('Backup wirklich wiederherstellen?'))return;Object.assign(state,safeClone(b.state)||{});state.history=Array.isArray(b.history)?safeClone(b.history):[];state.templates=Array.isArray(b.templates)?safeClone(b.templates):[];window.v5Comparisons=Array.isArray(b.comparisons)?safeClone(b.comparisons):[];await put('history',state.history);await put('templates',state.templates);await put('comparisons',window.v5Comparisons);saveState();syncUI();renderHistory();renderCompareSelectors();window.renderV5ComparisonHistory?.();renderHistories();alert('Backup wiederhergestellt.')}
function ensureBackupMenu(){const tech=[...document.querySelectorAll('.menu')].find(m=>m.querySelector(':scope>span')?.textContent.trim()==='Technisches');const dd=tech?.querySelector('.dropdown');if(!dd||dd.querySelector('[data-v14backup]'))return;const hr=document.createElement('hr');hr.dataset.v14backup='1';dd.appendChild(hr);const add=(txt,fn)=>{const b=document.createElement('button');b.textContent=txt;b.onclick=fn;dd.appendChild(b)};add('Backup: vollständig erstellen …',()=>makeBackup(true));add('Backup: ohne API-Schlüssel …',()=>makeBackup(false));const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.style.display='none';inp.onchange=async()=>{try{if(inp.files?.[0])await restore(inp.files[0])}catch(e){alert('Wiederherstellung fehlgeschlagen: '+e.message)}inp.value=''};dd.appendChild(inp);add('Backup wiederherstellen …',()=>inp.click())}
ensureBackupMenu();ensureHistoryBoxes();patchLoops();renderHistories();
// Späte V3/V5-Initialisierung überholen: einige Elemente entstehen erst nach unserem ersten Lauf.
let rounds=0;const iv=setInterval(()=>{rounds++;removeMemoryBanner();patchModelLists();applyGemini();patchLoops();ensureBackupMenu();renderHistories();if(rounds>80)clearInterval(iv)},500);
})();`;d.body.appendChild(s);clearInterval(t)}catch(e){if(ticks>300)clearInterval(t)}},100)});</script></body></html>
