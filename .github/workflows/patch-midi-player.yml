name: Patch Web V2.3 GM MIDI Player

on:
  push:
    branches: [android-v2-3]
    paths:
      - '.github/workflows/patch-midi-player.yml'
      - '.github/scripts/patch_midi_player.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web branch
        uses: actions/checkout@v4
        with:
          ref: composition-lab-v2
          path: web
          fetch-depth: 0
      - name: Checkout patch source
        uses: actions/checkout@v4
        with:
          ref: android-v2-3
          path: patchsrc
          fetch-depth: 1
      - name: Vendor soundfont-player
        run: curl -L --fail --retry 3 https://unpkg.com/soundfont-player@0.12.0/dist/soundfont-player.js -o web/soundfont-player.js
      - name: Patch index.html
        run: python patchsrc/.github/scripts/patch_midi_player.py web/index.html
      - name: Commit and push
        working-directory: web
        run: |
          git config user.name "Composition Lab Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html soundfont-player.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "V2.3: integrierten GM-SoundFont-Player hinzufügen"
            git push origin HEAD:composition-lab-v2
          fi
