name: Simplify Experiment Lab V6
on: push
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-lab-v2
      - run: python tools/simplify_experiment_lab_v6.py
      - run: |
          git config user.name "Composition Lab Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Simplify experiment lab controls"
          git push origin HEAD:composition-lab-v2
