name: Finalize Template History V4
on: push
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-lab-v2
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('<summary>Frühere Entwürfe</summary>\n            <div class="foldcontent"><div id="experimentHistoryList">Noch keine Entwürfe vorhanden.</div></div>', '<summary>Vorlagen-Verlauf (unabhängig gespeichert)</summary>\n            <div class="foldcontent">\n              <div class="toolbar" style="margin-top:0"><button type="button" class="secondary smallbtn" id="clearExperimentHistoryBtn">Vorlagen-Verlauf leeren</button></div>\n              <div id="experimentHistoryList">Noch keine Vorlagen vorhanden.</div>\n            </div>')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/finalize-template-history-v4.yml tools/upgrade_template_history_v4.py
          git config user.name "Composition Lab Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize independent template history"
          git push origin HEAD:composition-lab-v2
