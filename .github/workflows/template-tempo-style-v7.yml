name: Template Tempo Style V7
on: push
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-lab-v2
      - run: python tools/add_template_tempo_style_v7.py
      - run: |
          git config user.name "Composition Lab Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add template tempo and style controls"
          git push origin HEAD:composition-lab-v2
