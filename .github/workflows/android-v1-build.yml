name: Build Composition Lab Android V2.2 Unsigned

on:
  push:
    branches: [android-v2]
    paths:
      - 'android-v1/**'
      - '.github/workflows/android-v1-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: android-v1
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Rename unsigned APK
        run: cp android-v1/app/build/outputs/apk/release/app-release-unsigned.apk Composition-Lab-Android-V2.2-unsigned.apk

      - name: Prepare signing tools bundle
        run: |
          mkdir -p signer-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signer-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signer-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signer-tools/lib/

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Composition-Lab-Android-V2.2-unsigned
          path: Composition-Lab-Android-V2.2-unsigned.apk
          if-no-files-found: error

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-35
          path: signer-tools
          if-no-files-found: error
