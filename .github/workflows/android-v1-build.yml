name: Build Composition Lab Android V1

on:
  push:
    branches: [android-v1]
    paths:
      - 'android-v1/**'
      - '.github/workflows/android-v1-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-v1
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp android-v1/app/build/outputs/apk/debug/app-debug.apk Composition-Lab-Android-V1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Composition-Lab-Android-V1
          path: Composition-Lab-Android-V1.apk
          if-no-files-found: error
