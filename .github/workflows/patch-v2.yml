name: Patch Composition Lab V2

on:
  push:
    branches:
      - composition-lab-v2
    paths:
      - .github/workflows/patch-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-lab-v2
      - name: Apply robust player, fold-state and cache fix
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # Fold states belong to the central settings object, not only a late helper script.
          save_marker = '    localStorage.setItem(STORAGE_ID, JSON.stringify(data));\n  } catch(_) {}\n}\n\nfunction initApp(){'
          if save_marker in s and 'data.foldStates = data.foldStates || {};' not in s:
              repl = '''    data.foldStates = {};
    document.querySelectorAll("details[id]").forEach(el => { data.foldStates[el.id] = !!el.open; });

    localStorage.setItem(STORAGE_ID, JSON.stringify(data));
  } catch(_) {}
}

function initApp(){'''
              s = s.replace(save_marker, repl, 1)

          init_marker = '  syncUIForProvider(p);\n  renderHistory();\n}\n'
          if init_marker in s and 'data.foldStates && typeof data.foldStates === "object"' not in s:
              repl = '''  if(data.foldStates && typeof data.foldStates === "object"){
    document.querySelectorAll("details[id]").forEach(el => {
      if(Object.prototype.hasOwnProperty.call(data.foldStates, el.id)) el.open = !!data.foldStates[el.id];
    });
  }

  syncUIForProvider(p);
  renderHistory();
}
'''
              s = s.replace(init_marker, repl, 1)

          # Save immediately whenever any fold is changed.
          listener_marker = '$("rememberApiKey").addEventListener("change", saveCurrentState);\n'
          if listener_marker in s and 'document.querySelectorAll("details[id]").forEach(el => el.addEventListener("toggle", saveCurrentState));' not in s:
              s = s.replace(listener_marker, listener_marker + 'document.querySelectorAll("details[id]").forEach(el => el.addEventListener("toggle", saveCurrentState));\n', 1)

          # Direct template handoff: make template the source for every player path, including legacy lastScore code.
          old = '    mainPlayerScore = uploadedScore;\n    if($("mainPlayerTitle")) $("mainPlayerTitle").textContent = `Vorlage: ${randomTemplateScore.ti || "Vorlage"}`;'
          new = '    mainPlayerScore = uploadedScore;\n    lastScore = uploadedScore;\n    lastMidiBytes = buildMidi(uploadedScore);\n    if($("mainPlayerTitle")) $("mainPlayerTitle").textContent = `Vorlage: ${randomTemplateScore.ti || "Vorlage"}`;'
          if old in s:
              s = s.replace(old, new, 1)

          old = 'applyTemplateToComposition(uploadedScore,it.meta||{});mainPlayerScore=uploadedScore;if($("mainPlayerTitle"))'
          new = 'applyTemplateToComposition(uploadedScore,it.meta||{});mainPlayerScore=uploadedScore;lastScore=uploadedScore;lastMidiBytes=buildMidi(uploadedScore);if($("mainPlayerTitle"))'
          if old in s:
              s = s.replace(old, new, 1)

          # Main play button must always use the currently active source.
          s = s.replace('try { await playGMScore(mainPlayerScore || lastScore || uploadedScore); }', 'try { await playGMScore(mainPlayerScore || uploadedScore || lastScore); }')
          s = s.replace('bindSeek("playerSeek",()=>mainPlayerScore || lastScore || uploadedScore);', 'bindSeek("playerSeek",()=>mainPlayerScore || uploadedScore || lastScore);')

          # Force an updated service worker URL so Android/PWA cannot silently keep the old script.
          s = s.replace('navigator.serviceWorker.register("./service-worker.js")', 'navigator.serviceWorker.register("./service-worker.js?v=8")')

          p.write_text(s, encoding="utf-8")

          sw = Path("service-worker.js")
          w = sw.read_text(encoding="utf-8")
          w = w.replace("const CACHE_NAME = 'composition-lab-v2-1';", "const CACHE_NAME = 'composition-lab-v2-8';")
          # Navigation and index requests are explicitly network-first without HTTP cache.
          old_fetch = '''    fetch(event.request)
      .then(response => {'''
          new_fetch = '''    fetch(event.request, (event.request.mode === 'navigate' || event.request.url.endsWith('/index.html')) ? {cache:'no-store'} : undefined)
      .then(response => {'''
          if old_fetch in w:
              w = w.replace(old_fetch, new_fetch, 1)
          sw.write_text(w, encoding="utf-8")
      - name: Commit patch
        run: |
          git config user.name "Composition Lab Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Make template player handoff and fold states reliable"
          git push origin composition-lab-v2
