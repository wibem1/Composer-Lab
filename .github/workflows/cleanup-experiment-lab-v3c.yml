name: Cleanup Experiment Lab V3c
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-lab-v2
      - run: python3 tools/cleanup_experiment_lab_v3c.py
      - run: |
          git config user.name "Composition Lab Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Clean up experiment lab enhancements" || exit 0
          git push
