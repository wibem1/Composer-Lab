name: Fix Template Use V5b
on: push
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-lab-v2
      - run: python tools/fix_template_use_v5b.py
      - run: |
          git config user.name "Composition Lab Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix template use handoff"
          git push origin HEAD:composition-lab-v2
