name: Test CLAB v1 WebApp

on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-clab-v1.yml']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and semantic roundtrip
        run: |
          node --check shared/clab-document-v1.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          global.window=global;
          const els={
            measures:{value:'8'},meter:{value:'4/4'},tempo:{value:'96'},musicalKey:{value:'C major'},ensemble:{value:'Piano'},prompt:{value:'Testauftrag'},
            provider:{value:'openai',options:[{value:'openai'},{value:'anthropic'},{value:'gemini'}],dispatchEvent(){}},
            model:{value:'gpt-5.6-sol',options:[{value:'gpt-5.6-sol'}]},downloadBtn:{disabled:true},jsonBtn:{disabled:true},conceptView:{},lastResult:{},mainPlayerTitle:{},uploadInfo:{},status:{}
          };
          global.document={getElementById:id=>els[id]||null,createElement:()=>({style:{},appendChild(){},remove(){},click(){}}),body:{appendChild(){}}};
          global.Event=function(){};global.setInterval=()=>0;global.clearInterval=()=>{};global.URL={createObjectURL(){return'x'},revokeObjectURL(){}};
          global.Blob=function(){};global.buildMidi=()=>new Uint8Array();global.renderChatContext=()=>{};global.saveCurrentState=()=>{};
          vm.runInThisContext(fs.readFileSync('shared/clab-document-v1.js','utf8'));
          const score={ti:'Test',bpm:96,ts:{n:4,d:4},k:'C major',sm:'Impuls',tr:[{nm:'Piano',ch:0,pg:0,nt:[[0,1,60,80,1,1]],ct:[[0,64,127]],ev:[{b:0,t:'dyn',v:'p'}],me:[{b:0,m:'AA=='}]}]};
          const doc={format:'composition-lab-document',version:1,savedAt:1,title:'Test',score,concept:'Impuls',provider:'openai',model:'gpt-5.6-sol',measures:'8',meter:'4/4',tempo:'96',musicalKey:'C major',ensemble:'Piano',assignment:'Testauftrag',sourceName:null,sourceScore:null,originalMusicXMLData:'PHNjb3JlLz4=',futureField:{x:1},midiData:'legacy',musicXMLData:'legacy'};
          CompositionLabCLAB.applyDocument(doc,'test.clab');
          const out=CompositionLabCLAB.makeDocument();
          if(out.format!=='composition-lab-document'||out.version!==1)throw Error('format');
          if(out.futureField?.x!==1)throw Error('unknown field lost');
          if(out.originalMusicXMLData!=='PHNjb3JlLz4=')throw Error('original MusicXML lost');
          if(out.score.tr[0].ev[0].t!=='dyn'||!Array.isArray(out.score.tr[0].me))throw Error('ev/me lost');
          if('midiData' in out||'musicXMLData' in out)throw Error('legacy snapshots retained');
          if(JSON.stringify(out).toLowerCase().includes('apikey'))throw Error('api key field present');
          console.log('WebApp CLAB v1 semantic roundtrip OK');
          NODE
          rm -f .github/workflows/test-clab-v1.yml
      - name: Remove one-time test workflow
        run: |
          git config user.name 'Composition Lab tests'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Remove one-time CLAB v1 WebApp test workflow'
          git push
