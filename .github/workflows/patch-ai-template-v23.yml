name: Patch V2.3 AI Templates and Full Controls

on:
  push:
    branches: [android-v2-3]
    paths: ['.github/workflows/patch-ai-template-v23.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-lab-v2
          fetch-depth: 0
      - name: Patch index.html
        shell: python
        env:
          OLD_HTML_B64: ""
          NEW_HTML_B64: ""
          NEW_SCRIPT_B64: " bmg...?"
        run: |
          import os,base64
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=base64.b64decode(os.environ['OLD_HTML_B64']).decode('utf-8')
          new=base64.b64decode(os.environ['NEW_HTML_B64']).decode('utf-8')
          script=base64.b64decode(os.environ['NEW_SCRIPT_B64']).decode('utf-8')
          if old not in s: raise SystemExit('template html marker not found')
          s=s.replace(old,new,1)
          start=s.find('<script id="v23-template-controls">')
          if start<0: raise SystemExit('template script start not found')
          end=s.find('</script>',start)
          if end<0: raise SystemExit('template script end not found')
          end += len('</script>')
          s=s[:start]+script+s[end:]
          p.write_text(s,encoding='utf-8')
      - name: Commit and push
        run: |
          git config user.name "Composition Lab Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "V2.3: KI-Vorlagen mit vollständiger Player-Steuerung" || exit 0
          git push origin HEAD:composition-lab-v2
