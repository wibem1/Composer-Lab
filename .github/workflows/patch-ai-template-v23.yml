name: Patch V2.3 AI Templates and Full Controls

on:
  push:
    branches: [android-v2-3]
    paths:
      - '.github/workflows/patch-ai-template-v23.yml'
      - 'tools/patch_ai_template_v23.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-lab-v2
          fetch-depth: 0
      - name: Get patch script
        run: git show origin/android-v2-3:tools/patch_ai_template_v23.py > /tmp/patch_ai_template_v23.py
      - name: Patch index.html
        run: python /tmp/patch_ai_template_v23.py
      - name: Commit and push
        run: |
          git config user.name "Composition Lab Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "V2.3: KI-Vorlagen mit vollständiger Player-Steuerung"
            git push origin HEAD:composition-lab-v2
          fi
