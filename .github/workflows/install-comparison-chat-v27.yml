name: Install comparison chat v27
on:
  push:
    paths:
      - 'comparison-chat-v27.js'
      - '.github/workflows/install-comparison-chat-v27.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add comparison chat script to index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="comparison-chat-v27.js?v=27"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s)
          PY
      - name: Commit installation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Composition Lab Upgrader"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Load clean comparison lab chat handler"
          git push
