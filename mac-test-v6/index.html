<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Composition Lab – Mac Test V6</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8ebef}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="outer" src="../mac-test-v5/?macv6=1"></iframe><script>
const outer=document.getElementById('outer');
outer.addEventListener('load',()=>{let tries=0;const timer=setInterval(()=>{tries++;try{const od=outer.contentDocument;const inner=od?.getElementById('app');const d=inner?.contentDocument;if(!d?.getElementById('composeBtn')){if(tries>160)clearInterval(timer);return;}clearInterval(timer);const s=d.createElement('script');s.textContent=`(()=>{
const DB4='composition_lab_mac_history_v4',DB5='composition_lab_mac_history_v5';
function openDB(name){return new Promise((res,rej)=>{const r=indexedDB.open(name,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('data'))r.result.createObjectStore('data')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function get(name,key){const db=await openDB(name);const val=await new Promise((res,rej)=>{const tx=db.transaction('data','readonly'),r=tx.objectStore('data').get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});db.close();return val}
async function put(name,key,val){const db=await openDB(name);await new Promise((res,rej)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(val,key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}
(async()=>{try{const [h5,t5,c5,h4,t4]=await Promise.all([get(DB5,'history'),get(DB5,'templates'),get(DB5,'comparisons'),get(DB4,'history'),get(DB4,'templates')]);let changed=false;if((!Array.isArray(h5)||!h5.length)&&Array.isArray(h4)&&h4.length){await put(DB5,'history',h4);state.history=safeClone(h4);changed=true}if((!Array.isArray(t5)||!t5.length)&&Array.isArray(t4)&&t4.length){await put(DB5,'templates',t4);state.templates=safeClone(t4);changed=true}if(changed){renderHistory();renderCompareSelectors();if(typeof persistHistories==='function')persistHistories();}const banner=document.createElement('div');banner.style.cssText='position:fixed;right:14px;bottom:14px;z-index:9999;background:#243447;color:white;padding:8px 12px;border-radius:7px;font:12px -apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 3px 14px rgba(0,0,0,.2)';banner.textContent=changed?'Frühere Verläufe wurden wiederhergestellt.':'Verlaufsspeicher V6 aktiv.';document.body.appendChild(banner);setTimeout(()=>banner.remove(),3500)}catch(e){console.warn('V6 Verlaufsmigration',e)}})();
})();`;d.body.appendChild(s)}catch(e){if(tries>160)clearInterval(timer)}},100)});
</script></body></html>
