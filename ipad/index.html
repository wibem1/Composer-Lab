<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Composition Lab"><meta name="theme-color" content="#f3f5f8"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="composition-lab-logo.jpg"><title>Composition Lab – iPad</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8ebef}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="../ipad-web-v3/?stable=20260903-5"></iframe><script>
const BUILD='iPad Build 2026.09.03.5';
const outer=document.getElementById('app');
outer.addEventListener('load',()=>{let tries=0;const timer=setInterval(()=>{tries++;try{let d=outer.contentDocument;for(let i=0;i<12;i++){const f=d?.getElementById('app');if(f?.contentDocument)d=f.contentDocument;else break}if(!d?.getElementById('composeBtn')){if(tries>600)clearInterval(timer);return}clearInterval(timer);
const style=d.createElement('style');style.textContent=`.brandbox{overflow:hidden!important;height:108px!important;display:flex!important;align-items:center!important}.brandbox .logo,.brandbox .brand,.brandbox .subtitle{display:none!important}.brandbox .rich-logo{display:block;width:300px!important;max-width:300px!important;height:96px!important;max-height:96px!important;object-fit:contain!important;object-position:left center!important}.soundfont-badge{font-size:11px;color:#2f7c50;margin-top:5px}.titlebar{overflow:hidden!important}.ipad-build{margin-top:12px;padding-top:10px;border-top:1px solid #ddd;color:#68717c;font-size:12px}`;d.head.appendChild(style);
const brand=d.querySelector('.brandbox');if(brand&&!brand.querySelector('.rich-logo')){const img=d.createElement('img');img.className='rich-logo';img.src='../ipad/composition-lab-logo.jpg?v=2';img.alt='Composition Lab';brand.appendChild(img)}
const about=d.getElementById('aboutBtn');if(about){about.textContent='Über Composition Lab – iPad';about.onclick=()=>alert('Composition Lab\\niPad WebApp\\n'+BUILD+'\\nSoundFont-Wiedergabe: WebAudioFonts / FluidR3 GM\\nStand: 3. September 2026')}
const techModal=d.querySelector('#techModal .modal');if(techModal&&!d.getElementById('ipadBuild')){const foot=techModal.querySelector('.modalfoot');const info=d.createElement('div');info.id='ipadBuild';info.className='ipad-build';info.textContent=BUILD;if(foot)techModal.insertBefore(info,foot);else techModal.appendChild(info)}
// API-Schlüssel innerhalb der eigentlichen App dauerhaft halten.
const keyfix=d.createElement('script');keyfix.textContent=`(()=>{const KS='composition_lab_ipad_api_keys_v2';const baseSave=saveState;function readKeys(){try{return JSON.parse(localStorage.getItem(KS)||'{}')}catch(e){return{}}}function fieldsToKeys(){return{openai:(document.getElementById('keyOpenAI')?.value||'').trim(),anthropic:(document.getElementById('keyAnthropic')?.value||'').trim(),gemini:(document.getElementById('keyGemini')?.value||'').trim()}}function applyKeys(){const k=readKeys();state.rememberKeys=true;state.keys={...(state.keys||{}),openai:k.openai||state.keys?.openai||'',anthropic:k.anthropic||state.keys?.anthropic||'',gemini:k.gemini||state.keys?.gemini||''};const a=document.getElementById('keyOpenAI'),c=document.getElementById('keyAnthropic'),g=document.getElementById('keyGemini'),r=document.getElementById('rememberKeys');if(a)a.value=state.keys.openai||'';if(c)c.value=state.keys.anthropic||'';if(g)g.value=state.keys.gemini||'';if(r){r.checked=true;const lab=document.querySelector('label[for="rememberKeys"]');if(lab)lab.textContent='API-Schlüssel dauerhaft auf diesem iPad speichern'}}saveState=function(){state.rememberKeys=true;const k=fieldsToKeys();if(k.openai||k.anthropic||k.gemini){state.keys=k;localStorage.setItem(KS,JSON.stringify(k))}baseSave()};applyKeys();const b=document.getElementById('saveTech');if(b&&!b.dataset.persistV2){b.dataset.persistV2='1';b.addEventListener('click',()=>{const k=fieldsToKeys();state.rememberKeys=true;state.keys=k;localStorage.setItem(KS,JSON.stringify(k));setTimeout(()=>{applyKeys();baseSave()},0)},true)}const t=document.getElementById('techMenu');if(t&&!t.dataset.persistV2){t.dataset.persistV2='1';t.addEventListener('click',()=>setTimeout(applyKeys,0),true)}window.addEventListener('pageshow',applyKeys);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){const k=fieldsToKeys();if(k.openai||k.anthropic||k.gemini)localStorage.setItem(KS,JSON.stringify(k))}});})();`;d.body.appendChild(keyfix);
// Musikalische Qualitätsregeln und echter MIDI-Bearbeitungsdialog.
const qualityfix=d.createElement('script');qualityfix.textContent=`(()=>{const MUSICAL_SYSTEM='Du bist der Kompositionskern von Composition Lab. Schreibe musikalisch geschlossen, charaktervoll und aufführbar. Ein Stück braucht einen erkennbaren musikalischen Gedanken, motivische Entwicklung, Phrasen mit Richtung, überzeugende Harmonik und Stimmführung, rhythmische Gestalt, Dynamik und einen nachvollziehbaren Spannungsbogen. Vermeide mechanische Tonleiterläufe, bloße Akkordschleifen, durchlaufende gleichförmige Achtel ohne musikalische Funktion, zufällige Dissonanzen, stereotype Alberti- oder Wechselmuster, konstante Anschlagsstärken, unmotivierte Registersprünge und abrupte Formwechsel. Stimmen müssen spielbar und idiomatisch sein. Wiederholung ist nur sinnvoll, wenn sie Entwicklung oder Form trägt. Plane Anfang, Entwicklung, Höhepunkt und Schluss, bevor du Noten setzt. Gib bei einer Kompositionsaufgabe ausschließlich das von der App verlangte gültige Score-JSON zurück, ohne Erklärung davor oder danach.';
const oldCompose=document.getElementById('composeBtn');if(oldCompose&&!oldCompose.dataset.qualityV5){oldCompose.dataset.qualityV5='1';oldCompose.onclick=()=>busy(oldCompose,async()=>{setStatus('main','Komposition wird musikalisch geplant und erzeugt …');try{const settings={ensemble:document.getElementById('ensemble')?.value||'Klavier solo',key:document.getElementById('keySig')?.value||'frei',meter:document.getElementById('meter')?.value||'frei',bpm:Number(document.getElementById('tempo')?.value)||92,measures:Number(document.getElementById('length')?.value)||32,idea:document.getElementById('compIdea')?.value||'',auftrag:document.getElementById('compTask')?.value||document.getElementById('compositionTask')?.value||''};const source=compactScore(state.source||state.template,6500);const task='Erzeuge jetzt eine vollständige MIDI-Komposition.\\nRahmenbedingungen: '+JSON.stringify(settings)+'\\n'+(source?'Vorhandenes musikalisches Material: '+JSON.stringify(source)+'\\nEntwickle dessen musikalische Identität weiter; kopiere es nicht mechanisch.':'Kein Ausgangs-MIDI vorhanden.')+'\\nDie Ziel-Länge soll möglichst genau erreicht werden. Achte besonders auf einen tragenden Gedanken, motivische Verwandlung, natürliche Phrasen, funktionierende Bass-/Innenstimmen, differenzierte Dynamik und einen überzeugenden Schluss.';const txt=await callLLM(MUSICAL_SYSTEM,task),s=parseScoreText(txt);s.bpm=settings.bpm;s._meta={ensemble:settings.ensemble,measures:settings.measures};state.current=s;state.history=Array.isArray(state.history)?state.history:[];state.history.push(safeClone(s));if(state.history.length>30)state.history.shift();saveState();syncUI();setStatus('main','Neue Komposition geladen.')}catch(e){setStatus('main',e.message,'err')}})}
const send=document.getElementById('compositionChatSend'),input=document.getElementById('compositionChatInput'),log=document.getElementById('compositionChat');if(send&&input&&log&&!send.dataset.midiEditV5){send.dataset.midiEditV5='1';send.onclick=async()=>{const q=input.value.trim();if(!q)return;addMsg(log,'user',q);input.value='';send.disabled=true;try{const current=state.current||state.source||state.template;if(!current){const a=await callLLM('Du bist ein musikalischer Analyse- und Kompositionspartner. Antworte knapp und konkret.',q);addMsg(log,'ai',a);state.lastAI=a;saveState();return}const ctx=compactScore(current,7500);const sys=MUSICAL_SYSTEM+' Wenn der Nutzer eine musikalische Änderung, Überarbeitung, Variation, Fortsetzung, Kürzung, Verlängerung, Neu-Instrumentierung oder sonstige Bearbeitung der geladenen Komposition verlangt, gib AUSSCHLIESSLICH ein vollständiges gültiges Score-JSON der bearbeiteten Fassung zurück. Wenn er nur etwas wissen, analysieren oder diskutieren möchte, antworte als normaler Text und erzeuge kein JSON.';const prompt='Nutzeranfrage: '+q+'\\n\\nAktuell geladene Komposition als strukturierte MIDI-Daten:\\n'+JSON.stringify(ctx)+'\\n\\nBei einer Bearbeitung muss die neue Fassung vollständig sein und als neue MIDI-Komposition geladen werden; nicht nur beschreiben, was geändert werden sollte.';const answer=await callLLM(sys,prompt);let revised=null;try{revised=parseScoreText(answer)}catch(e){}if(revised&&Array.isArray(revised.tr)&&revised.tr.some(t=>t.nt?.length)){state.current=revised;state.history=Array.isArray(state.history)?state.history:[];state.history.push(safeClone(revised));if(state.history.length>30)state.history.shift();state.lastAI='Neue MIDI-Fassung erzeugt.';saveState();syncUI();addMsg(log,'ai','Die Überarbeitung ist als neue MIDI-Fassung geladen. Du kannst sie jetzt abspielen oder mit „MIDI speichern …“ sichern.');setStatus('main','Überarbeitete MIDI aus dem KI-Dialog geladen.')}else{state.lastAI=answer;saveState();addMsg(log,'ai',answer)}}catch(e){addMsg(log,'ai','Fehler: '+e.message)}finally{send.disabled=false}}}
})();`;d.body.appendChild(qualityfix);
const module=d.createElement('script');module.type='module';module.textContent=`import MidiAudioPlayer from 'https://esm.unpkg.com/midi-audio-player@2.0.3'; window.__CompositionLabMidiAudioPlayer=MidiAudioPlayer; window.dispatchEvent(new Event('compositionlab-soundfont-ready'));`;d.head.appendChild(module);
const patch=d.createElement('script');patch.textContent=`(()=>{const engines=new Map();let Ctor=window.__CompositionLabMidiAudioPlayer||null;window.addEventListener('compositionlab-soundfont-ready',()=>{Ctor=window.__CompositionLabMidiAudioPlayer;document.querySelectorAll('.player .status').forEach(x=>{if(/Bereit/.test(x.textContent||''))x.textContent='Bereit · SoundFont GM'})});function scoreKey(s){try{return JSON.stringify([s?.bpm,s?.ts,s?.tr?.map(t=>[t.ch,t.pg,t.nt?.length,t.nt?.[0],t.nt?.[t.nt.length-1]])])}catch(e){return String(Date.now())}}async function getEngine(id,p,box){if(!Ctor)throw Error('SoundFont-Engine wird noch geladen. Bitte gleich noch einmal auf Play tippen.');let rec=engines.get(id);if(!rec){const engine=new Ctor({volume:Number(box.querySelector('.vol')?.value||.75),reverb:.16,eqPreset:'classical',preferred:['FluidR3_GM'],localCache:true});rec={engine,key:null};engines.set(id,rec)}return rec}stopPlayer=function(id,keep=false){const p=audio.players[id];const rec=engines.get(id);if(rec?.engine)rec.engine.stop().catch(()=>{});if(p){clearInterval(p.timer);p.timer=null;p.playing=false;if(!keep)p.offset=0;p.nodes=[]}updatePlayer(id)};playPlayer=async function(id){const p=audio.players[id];if(!p?.score)return setStatus(id,'Keine MIDI geladen.','warn');const box=document.querySelector('[data-player="'+id+'"]');if(!box)return;try{stopPlayer(id,true);setStatus(id,'SoundFont wird vorbereitet …');const rec=await getEngine(id,p,box),key=scoreKey(p.score);rec.engine.volume=Number(box.querySelector('.vol')?.value||.75);if(rec.key!==key){const bytes=buildMidi(p.score);const buf=bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength);await rec.engine.load(buf);rec.key=key}const pos=Math.max(0,Number(p.offset)||0);if(pos>0)await rec.engine.skipToSeconds(pos);const ok=await rec.engine.play();if(ok===false)throw Error('Audio konnte nicht gestartet werden. Bitte erneut auf Play tippen.');p.startAt=getCtx().currentTime;p.playing=true;p.timer=setInterval(()=>updatePlayer(id),150);setStatus(id,'Wiedergabe läuft · SoundFont GM')}catch(e){p.playing=false;setStatus(id,'SoundFont: '+(e.message||e),'err')}};pausePlayer=async function(id){const p=audio.players[id];if(!p?.playing)return;const rec=engines.get(id);const elapsed=getCtx().currentTime-p.startAt;p.offset=(p.offset||0)+elapsed;p.playing=false;clearInterval(p.timer);p.timer=null;try{await rec?.engine?.pause()}catch(e){}updatePlayer(id);setStatus(id,'Pausiert · SoundFont GM')};document.querySelectorAll('.player').forEach(box=>{const id=box.dataset.player;const st=box.querySelector('.status');if(st&&!st.nextElementSibling?.classList?.contains('soundfont-badge')){const b=document.createElement('div');b.className='soundfont-badge';b.textContent='Sample-Klänge: GM SoundFont';st.after(b)}box.querySelector('.vol').oninput=()=>{const rec=engines.get(id);if(rec?.engine)rec.engine.volume=Number(box.querySelector('.vol').value)}});})();`;d.body.appendChild(patch);
}catch(e){if(tries>600)clearInterval(timer)}},100)});
</script></body></html>
