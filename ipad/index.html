<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Composition Lab"><meta name="theme-color" content="#f3f5f8"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="composition-lab-logo.jpg"><title>Composition Lab – iPad</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8ebef}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="../ipad-web-v3/?stable=20260903-1"></iframe><script>
const outer=document.getElementById('app');
outer.addEventListener('load',()=>{let tries=0;const timer=setInterval(()=>{tries++;try{let d=outer.contentDocument;for(let i=0;i<12;i++){const f=d?.getElementById('app');if(f?.contentDocument)d=f.contentDocument;else break}if(!d?.getElementById('composeBtn')){if(tries>600)clearInterval(timer);return}clearInterval(timer);
const style=d.createElement('style');style.textContent=`.brandbox{overflow:hidden!important;display:flex!important;align-items:center!important;height:118px!important;min-height:118px!important}.brandbox .logo,.brandbox .brand,.brandbox .subtitle{display:none!important}.brandbox .rich-logo{display:block!important;width:178px!important;max-width:178px!important;height:112px!important;max-height:112px!important;object-fit:contain!important;object-position:center!important;margin:0!important}.soundfont-badge{font-size:11px;color:#2f7c50;margin-top:5px}.titlebar{overflow:hidden!important}`;d.head.appendChild(style);
const brand=d.querySelector('.brandbox');if(brand&&!brand.querySelector('.rich-logo')){const img=d.createElement('img');img.className='rich-logo';img.src='../ipad/composition-lab-logo.jpg?v=2';img.alt='Composition Lab';brand.appendChild(img)}
const about=d.getElementById('aboutBtn');if(about){about.textContent='Über Composition Lab – iPad';about.onclick=()=>alert('Composition Lab\\niPad WebApp\\nSoundFont-Wiedergabe: WebAudioFonts / FluidR3 GM\\nStand: 3. September 2026')}
const module=d.createElement('script');module.type='module';module.textContent=`import MidiAudioPlayer from 'https://esm.unpkg.com/midi-audio-player@2.0.3'; window.__CompositionLabMidiAudioPlayer=MidiAudioPlayer; window.dispatchEvent(new Event('compositionlab-soundfont-ready'));`;d.head.appendChild(module);
const patch=d.createElement('script');patch.textContent=`(()=>{const engines=new Map();let Ctor=window.__CompositionLabMidiAudioPlayer||null;window.addEventListener('compositionlab-soundfont-ready',()=>{Ctor=window.__CompositionLabMidiAudioPlayer;document.querySelectorAll('.player .status').forEach(x=>{if(/Bereit/.test(x.textContent||''))x.textContent='Bereit · SoundFont GM'})});function scoreKey(s){try{return JSON.stringify([s?.bpm,s?.ts,s?.tr?.map(t=>[t.ch,t.pg,t.nt?.length,t.nt?.[0],t.nt?.[t.nt.length-1]])])}catch(e){return String(Date.now())}}async function getEngine(id,p,box){if(!Ctor)throw Error('SoundFont-Engine wird noch geladen. Bitte gleich noch einmal auf Play tippen.');let rec=engines.get(id);if(!rec){const engine=new Ctor({volume:Number(box.querySelector('.vol')?.value||.75),reverb:.16,eqPreset:'classical',preferred:['FluidR3_GM'],localCache:true});rec={engine,key:null};engines.set(id,rec)}return rec}stopPlayer=function(id,keep=false){const p=audio.players[id];const rec=engines.get(id);if(rec?.engine)rec.engine.stop().catch(()=>{});if(p){clearInterval(p.timer);p.timer=null;p.playing=false;if(!keep)p.offset=0;p.nodes=[]}updatePlayer(id)};playPlayer=async function(id){const p=audio.players[id];if(!p?.score)return setStatus(id,'Keine MIDI geladen.','warn');const box=document.querySelector('[data-player="'+id+'"]');if(!box)return;try{stopPlayer(id,true);setStatus(id,'SoundFont wird vorbereitet …');const rec=await getEngine(id,p,box),key=scoreKey(p.score);rec.engine.volume=Number(box.querySelector('.vol')?.value||.75);if(rec.key!==key){const bytes=buildMidi(p.score);const buf=bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength);await rec.engine.load(buf);rec.key=key}const pos=Math.max(0,Number(p.offset)||0);if(pos>0)await rec.engine.skipToSeconds(pos);const ok=await rec.engine.play();if(ok===false)throw Error('Audio konnte nicht gestartet werden. Bitte erneut auf Play tippen.');p.startAt=getCtx().currentTime;p.playing=true;p.timer=setInterval(()=>updatePlayer(id),150);setStatus(id,'Wiedergabe läuft · SoundFont GM')}catch(e){p.playing=false;setStatus(id,'SoundFont: '+(e.message||e),'err')}};pausePlayer=async function(id){const p=audio.players[id];if(!p?.playing)return;const rec=engines.get(id);const elapsed=getCtx().currentTime-p.startAt;p.offset=(p.offset||0)+elapsed;p.playing=false;clearInterval(p.timer);p.timer=null;try{await rec?.engine?.pause()}catch(e){}updatePlayer(id);setStatus(id,'Pausiert · SoundFont GM')};document.querySelectorAll('.player').forEach(box=>{const id=box.dataset.player;const st=box.querySelector('.status');if(st&&!st.querySelector('.soundfont-badge')){const b=document.createElement('div');b.className='soundfont-badge';b.textContent='Sample-Klänge: GM SoundFont';st.after(b)}box.querySelector('.vol').oninput=()=>{const rec=engines.get(id);if(rec?.engine)rec.engine.volume=Number(box.querySelector('.vol').value)}});})();`;d.body.appendChild(patch);
}catch(e){if(tries>600)clearInterval(timer)}},100)});
</script></body></html>
