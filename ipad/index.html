const keyfix=d.createElement('script');keyfix.textContent=`(()=>{const KS='composition_lab_ipad_api_keys_v2';const baseSave=saveState;function readKeys(){try{return JSON.parse(localStorage.getItem(KS)||'{}')}catch(e){return{}}}function fieldsToKeys(){return{openai:(document.getElementById('keyOpenAI')?.value||'').trim(),anthropic:(document.getElementById('keyAnthropic')?.value||'').trim(),gemini:(document.getElementById('keyGemini')?.value||'').trim()}}function applyKeys(){const k=readKeys();state.rememberKeys=true;state.keys={...(state.keys||{}),openai:k.openai||state.keys?.openai||'',anthropic:k.anthropic||state.keys?.anthropic||'',gemini:k.gemini||state.keys?.gemini||''};const a=document.getElementById('keyOpenAI'),c=document.getElementById('keyAnthropic'),g=document.getElementById('keyGemini'),r=document.getElementById('rememberKeys');if(a)a.value=state.keys.openai||'';if(c)c.value=state.keys.anthropic||'';if(g)g.value=state.keys.gemini||'';if(r){r.checked=true;const lab=document.querySelector('label[for="rememberKeys"]');if(lab)lab.textContent='API-Schlüssel dauerhaft auf diesem iPad speichern'}}saveState=function(){state.rememberKeys=true;const k=fieldsToKeys();if(k.openai||k.anthropic||k.gemini){state.keys=k;localStorage.setItem(KS,JSON.stringify(k))}baseSave()};applyKeys();const b=document.getElementById('saveTech');if(b&&!b.dataset.persistV2){b.dataset.persistV2='1';b.addEventListener('click',()=>{const k=fieldsToKeys();state.rememberKeys=true;state.keys=k;localStorage.setItem(KS,JSON.stringify(k));setTimeout(()=>{applyKeys();baseSave()},0)},true)}const t=document.getElementById('techMenu');if(t&&!t.dataset.persistV2){t.dataset.persistV2='1';t.addEventListener('click',()=>setTimeout(applyKeys,0),true)}window.addEventListener('pageshow',applyKeys);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){const k=fieldsToKeys();if(k.openai||k.anthropic||k.gemini)localStorage.setItem(KS,JSON.stringify(k))}});})();`;d.body.append const module=d.createElement('script');module.type='module';module.textContent=`
import {SplendidGrandPiano,Soundfont,Sequencer} from 'https://unpkg.com/smplr/dist/index.mjs';
const instruments=new Map();
const sequencers=new Map();
const gm={0:'acoustic_grand_piano',1:'bright_acoustic_piano',2:'electric_grand_piano',3:'honkytonk_piano',4:'electric_piano_1',5:'electric_piano_2',6:'harpsichord',7:'clavinet',8:'celesta',9:'glockenspiel',10:'music_box',11:'vibraphone',12:'marimba',13:'xylophone',14:'tubular_bells',19:'church_organ',24:'acoustic_guitar_nylon',25:'acoustic_guitar_steel',26:'electric_guitar_jazz',27:'electric_guitar_clean',32:'acoustic_bass',33:'electric_bass_finger',40:'violin',41:'viola',42:'cello',43:'contrabass',44:'tremolo_strings',45:'pizzicato_strings',46:'orchestral_harp',48:'string_ensemble_1',49:'string_ensemble_2',52:'choir_aahs',53:'voice_oohs',56:'trumpet',57:'trombone',58:'tuba',59:'muted_trumpet',60:'french_horn',61:'brass_section',64:'soprano_sax',65:'alto_sax',66:'tenor_sax',67:'baritone_sax',68:'oboe',69:'english_horn',70:'bassoon',71:'clarinet',72:'piccolo',73:'flute',74:'recorder',75:'pan_flute'};
function nameFor(pg){return gm[Number(pg)]||'acoustic_grand_piano'}
async function getInstrument(pg){const n=Number(pg)||0;const key=n===0?'splendid':'gm-'+n;if(instruments.has(key))return instruments.get(key);const ctx=getCtx();const inst=n===0?SplendidGrandPiano(ctx,{volume:90}):Soundfont(ctx,{instrument:nameFor(n),kit:'MusyngKite'});instruments.set(key,inst);await inst.ready;return inst}
function stopSeq(id){const seq=sequencers.get(id);if(seq){try{seq.stop()}catch(e){}sequencers.delete(id)}}
function noteStart(nt){return Number(nt?.t ?? nt?.[0] ?? 0)||0}
function noteDur(nt){return Math.max(.02,Number(nt?.d ?? nt?.[1] ?? .25)||.25)}
function notePitch(nt){return Number(nt?.p ?? nt?.[2] ?? 60)||60}
function noteVel(nt){return Math.max(1,Math.min(127,Number(nt?.v ?? nt?.[3] ?? 80)||80))}
window.stopPlayer=function(id,keep=false){const p=audio.players[id];stopSeq(id);if(p){clearInterval(p.timer);p.timer=null;p.playing=false;if(!keep)p.offset=0;p.nodes=[]}updatePlayer(id)};
window.playPlayer=async function(id){const p=audio.players[id];if(!p?.score)return setStatus(id,'Keine MIDI geladen.','warn');const box=document.querySelector('[data-player="'+id+'"]');if(!box)return;try{const ctx=getCtx();if(ctx.state==='suspended')await ctx.resume();stopPlayer(id,true);setStatus(id,'Echte Samples werden geladen …');const bpm=Number(p.score.bpm)||92,offsetSec=Math.max(0,Number(p.offset)||0),offsetBeat=offsetSec*bpm/60,tracks=Array.isArray(p.score.tr)?p.score.tr:[];const seq=Sequencer(ctx,{bpm,ppq:480,loop:false});for(const tr of tracks){const inst=await getInstrument(tr.pg);try{if(inst.output)inst.output.volume=Math.round(Number(box.querySelector('.vol')?.value||.75)*100)}catch(e){}const notes=[];for(const nt of (tr.nt||[])){const startBeat=noteStart(nt),durBeat=noteDur(nt);if(startBeat+durBeat<=offsetBeat)continue;const atBeat=Math.max(0,startBeat-offsetBeat),remaining=startBeat<offsetBeat?Math.max(.02,durBeat-(offsetBeat-startBeat)):durBeat;notes.push({note:notePitch(nt),at:Math.round(atBeat*480),duration:Math.max(1,Math.round(remaining*480)),velocity:noteVel(nt)})}if(notes.length)seq.addTrack(inst,notes)}sequencers.set(id,seq);seq.on?.('end',()=>{const q=audio.players[id];if(q){q.playing=false;q.offset=0;clearInterval(q.timer);q.timer=null;updatePlayer(id);setStatus(id,'Bereit · echte Samples')}});p.startAt=ctx.currentTime;p.playing=true;p.timer=setInterval(()=>updatePlayer(id),150);seq.start();setStatus(id,'Wiedergabe läuft · echte Samples · Sequencer')}catch(e){p.playing=false;setStatus(id,'Sample-Audio: '+(e.message||e),'err')}};
window.pausePlayer=function(id){const p=audio.players[id];if(!p?.playing)return;const ctx=getCtx(),elapsed=Math.max(0,ctx.currentTime-p.startAt);p.offset=(p.offset||0)+elapsed;p.playing=false;clearInterval(p.timer);p.timer=null;stopSeq(id);updatePlayer(id);setStatus(id,'Pausiert · echte Samples')};
document.querySelectorAll('.player').forEach(box=>{const st=box.querySelector('.status');if(st&&!st.nextElementSibling?.classList?.contains('soundfont-badge')){const b=document.createElement('div');b.className='soundfont-badge';b.textContent='Samples: Splendid Grand Piano / MusyngKite · smplr Sequencer · Score-Mapping V13';st.after(b)}});
